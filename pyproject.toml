[project]
name = "baixou"
version = "0.1.0"
description = "Baixou — alerta de preço self-hosted para ações da B3 e criptomoedas"
requires-python = ">=3.14"
dependencies = [
    "fastapi~=0.162.0",
    "httpx~=0.28.1",
    "tzdata~=2026.5",
    "uvicorn~=0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/baixou"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
