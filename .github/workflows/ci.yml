# CI mínimo e real da Fase 1 (D-05): ruff + pytest, somente em pull requests.
# Escolha explícita do autor (01-CONTEXT D-05): nada de execução em empurrão
# direto de branch. Crescimento por fase — frontend/tipos entram na Fase 5;
# audit, varredura de segredos e publicação na Fase 6. O pytest daqui executa
# a suíte completa do backend, incluindo migrações, config, fronteira de
# importação (D-07) e o /healthz. `uv sync --frozen` nunca re-resolve o
# uv.lock (T-01-SC).

name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: ruff + pytest (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Instalar dependências exatas do lock
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check backend

      - name: Formato (ruff format --check)
        run: uv run ruff format --check backend

      - name: Testes (pytest)
        run: uv run pytest backend/tests -q
