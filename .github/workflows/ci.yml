# CI mínimo e real da Fase 1 (D-05): ruff + pytest, somente em pull requests.
# Escolha explícita do autor (01-CONTEXT D-05): nada de execução em empurrão
# direto de branch. Crescimento por fase — o job do frontend entrou na Fase 5
# (05-05): lint, tsc, testes, build, cheque de desatualização dos tipos
# gerados do openapi.json e npm audit de produção. Na Fase 6 (06-02) a
# varredura de segredos ENTROU como job próprio (gitleaks, abaixo) e a
# publicação virou workflow próprio (.github/workflows/release.yml,
# disparado por tag vX.Y.Z — D-09). O pytest daqui executa a suíte completa
# do backend, incluindo migrações, config, fronteira de importação (D-07) e
# o /healthz. `uv sync --frozen` nunca re-resolve o uv.lock (T-01-SC).

name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: ruff + pytest (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Instalar dependências exatas do lock
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check backend

      - name: Formato (ruff format --check)
        run: uv run ruff format --check backend

      - name: Testes (pytest)
        run: uv run pytest backend/tests -q

  # Fase 5 (05-05): a malha da arquitetura sobre o frontend, no MESMO PR do
  # backend (jobs independentes — sem needs). Node vem do frontend/.nvmrc,
  # a MESMA major do estágio node do Dockerfile (uma fonte, três consumidores).
  # O cheque de desatualização reprova o PR em que os tipos gerados
  # divergirem do backend/openapi.json (T-05-15); o audit reprova
  # vulnerabilidade high/critical em dependências de PRODUÇÃO (T-05-16) —
  # devDeps não bloqueiam.
  frontend:
    name: lint + test + build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências exatas do lock
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm run test

      - name: Build (vite)
        run: npm run build

      - name: Regenerar tipos do contrato congelado
        run: npm run generate-types

      - name: Tipos gerados em dia com o openapi.json
        run: |
          if ! git diff --exit-code -- src/api/generated; then
            echo "::error::frontend/src/api/generated está desatualizado frente ao backend/openapi.json — rode npm run generate-types e commite os tipos regenerados no mesmo PR"
            exit 1
          fi

      - name: Audit das dependências de produção
        run: npm audit --omit=dev --audit-level=high

  # Fase 6 (06-02): varredura de segredos em TODO PR — a privacidade do
  # repositório (PROJECT.md) proíbe domínio, IP, chat ID, tópico ntfy ou
  # token do autor no repositório E no histórico, então o checkout traz o
  # histórico completo (fetch-depth: 0) e a varredura cobre tudo ANTES de
  # qualquer publicação pública. Action oficial pinada na tag imutável
  # completa corrente (mesmo padrão do astral-sh/setup-uv@v10.3.2: nunca tag
  # móvel de major, nunca @main — T-06-SC). Job independente, sem needs.
  gitleaks:
    name: varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
